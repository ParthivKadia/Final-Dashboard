server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Cache hashed static assets aggressively (Vite fingerprints filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fonts served from /fonts/geist — cache long, and set CORS in case
    # they're ever loaded cross-origin (e.g. from a CDN-fronted domain)
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # SPA fallback — required for react-router client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}